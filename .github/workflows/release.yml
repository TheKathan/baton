name: release

# Versioning is trunk-based (TheKathan/trunk-semver): every PR merged into main is
# released. The merged PR's source branch picks the bump:
#   feature/* or feat/*  -> minor (0.1.0 -> 0.2.0)
#   anything else        -> patch (0.1.0 -> 0.1.1)
#   release/X.Y.Z        -> exactly vX.Y.Z (for a new major such as 1.0.0, which bumps can't reach)
# Pushes (the version commit and the tags) go through a deploy key, the only actor the
# rulesets on main and on v* tags let through without a PR. The key lives in the
# "release" environment, which only main may use.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  test:
    # the bot's own version commit must not release again
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Test
        run: make test

  release:
    needs: test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.exact.outputs.version || steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Exact version from a release/X.Y.Z branch
        id: exact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          src=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].head.ref // ""')
          if [[ "$src" =~ ^release/v?([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            v="v${BASH_REMATCH[1]}"
            if git rev-parse -q --verify "refs/tags/$v" >/dev/null; then
              echo "::error::tag $v already exists"; exit 1
            fi
            echo "version=$v" >> "$GITHUB_OUTPUT"
            echo "Exact release $v from $src" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep trunk-semver's tags in a local sandbox
        if: steps.exact.outputs.version == ''
        run: |
          set -euo pipefail
          echo "ORIGIN_URL=$(git remote get-url origin)" >> "$GITHUB_ENV"
          git clone --quiet --mirror . "$RUNNER_TEMP/tag-sandbox.git"
          git remote set-url origin "$RUNNER_TEMP/tag-sandbox.git"

      - name: Version
        id: version
        if: steps.exact.outputs.version == ''
        uses: TheKathan/trunk-semver@bdfa679941c534feeb98f967803cff48cdc3455e # v1.0.14
        with:
          major-version: "1"
          add-to-summary: "true"

      - name: Point origin back at GitHub
        if: steps.exact.outputs.version == ''
        run: git remote set-url origin "$ORIGIN_URL"

      - name: Write the version into the files and tag that commit
        env:
          VERSION: ${{ steps.exact.outputs.version || steps.version.outputs.version }}
        run: |
          set -euo pipefail
          MAJOR="${VERSION%%.*}"
          remote_tag=$(git ls-remote --tags origin "refs/tags/$VERSION")
          if [[ -n "$remote_tag" ]]; then
            echo "::error::tag $VERSION already exists on GitHub; exact version tags are never moved"; exit 1
          fi
          python3 scripts/set_version.py "$VERSION"
          python3 scripts/set_version.py --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "files already at $VERSION"
          else
            git commit -am "chore(release): $VERSION"
            git push origin HEAD:main
          fi
          git tag -d "$VERSION" >/dev/null 2>&1 || true
          git tag "$VERSION"
          git tag -f "$MAJOR"
          git push origin "refs/tags/$VERSION"
          git push --force origin "refs/tags/$MAJOR"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.exact.outputs.version || steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "release $VERSION already exists"
            exit 0
          fi
          python3 scripts/set_version.py --notes "$VERSION" > notes.md
          gh release create "$VERSION" --title "$VERSION" --notes-file notes.md --verify-tag

  build:
    needs: release
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.release.outputs.version }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build the sdist and the wheel
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/set_version.py --check
          python3 -m pip install --disable-pip-version-check "build==1.3.0"
          python3 -m build
          ls -l dist
          test -f "dist/baton_handoff-${VERSION#v}.tar.gz"
          test -f "dist/baton_handoff-${VERSION#v}-py3-none-any.whl"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: [release, build]
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/baton-handoff/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true
