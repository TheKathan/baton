[project]
name = "baton-handoff"
dynamic = ["version"]
description = "A file-based, append-only coordination board for AI agents building software together"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gonçalo Faria" }]
keywords = ["ai-agents", "coordination", "multi-agent", "handoff", "cli", "mcp", "claude-code"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
  "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/TheKathan/baton"
Documentation = "https://github.com/TheKathan/baton/tree/main/docs"
Source = "https://github.com/TheKathan/baton"
Issues = "https://github.com/TheKathan/baton/issues"
Changelog = "https://github.com/TheKathan/baton/blob/main/CHANGELOG.md"

[project.scripts]
baton = "baton.cli:main"
baton-handoff = "baton.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "baton.__version__" }

[tool.setuptools.package-data]
baton = ["skill/*.md"]
