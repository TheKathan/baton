[project]
name = "baton"
version = "0.1.0"
description = "A file-based, append-only coordination board for AI agents building software together"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
baton = "baton.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
