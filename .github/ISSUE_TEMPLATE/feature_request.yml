name: Feature request
description: Suggest a change to how baton works.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What your agents or your team ran into. A real example helps most.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like baton to do
      description: baton stays vendor-neutral, so describe the behaviour rather than an integration with one product.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
