nchor="middle">FE</text><rect x="96" y="62" width="600" height="54" rx="12" fill="#0D1117" stroke="#30363D"/><text x="112" y="84" class="s b14" fill="#E6EDF3">frontend</text><rect x="186" y="68" width="59.0" height="21" rx="4" fill="#1B2230" stroke="#30363D"/><text x="215.5" y="83.5" class="m b14" fill="#91A7FF" text-anchor="middle">Q-001</text><text x="255.0" y="84" class="s r14" fill="#9198A1">to backend</text><text x="112" y="106" class="s r15" fill="#E6EDF3">Which route serves the health check?</text><text x="680" y="84" class="m r14" fill="#9198A1" text-anchor="end">#1 in log</text></g><g class="r2"><circle cx="64" cy="155" r="17" fill="#1A2142" stroke="#91A7FF"/><text x="64" y="160" class="s b14" fill="#91A7FF" text-anchor="middle">BE</text><text x="112" y="202" class="m r14" fill="#9198A1">baton handoff --as backend --phase S1-A --state DONE --to qa …</text></g><g class="r2b"><rect x="96" y="128" width="600" height="54" rx="12" fill="#0D1117" stroke="#30363D"/><text x="112" y="150" class="s b14" fill="#E6EDF3">backend</text><rect x="186" y="134" width="24.6" height="21" rx="4" fill="#1B2230" stroke="#30363D"/><text x="198.3" y="149.5" class="m b14" fill="#91A7FF" text-anchor="middle">H</text><text x="220.6" y="150" class="s r14" fill="#9198A1">to qa</text><text x="112" y="172" class="s r15" fill="#E6EDF3">Health endpoint done, handing off to qa.</text></g><g class="r2x"><line x1="110" y1="167" x2="394" y2="167" stroke="#F85149" stroke-width="2"/><text x="680" y="150" class="m r14" fill="#F85149" text-anchor="end">refused, not in log</text><rect x="96" y="128" width="600" height="54" rx="12" fill="none" stroke="#F85149" stroke-width="1.5"/></g><g class="rn"><circle cx="64" cy="244" r="17" fill="#2B1D10" stroke="#F76707"/><rect x="55.0" y="241.0" width="18.0" height="6.0" rx="3.0" fill="#F76707" transform="rotate(-35 64 244)"/><rect x="96" y="214" width="600" height="74" rx="12" fill="#2B1D10" stroke="#F76707"/><text x="112" y="236" class="s b14" fill="#FF922B"