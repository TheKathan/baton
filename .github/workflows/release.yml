name: release

# Versioning is trunk-based (TheKathan/trunk-semver): every PR merged into main is
# released. The merged PR's source branch picks the bump:
#   feature/* or feat/*  -> minor (0.1.0 -> 0.2.0)
#   anything else        -> patch (0.1.0 -> 0.1.1)
# After the tag is created, the version is written into the files (bot commit), the
# tags are moved onto that commit, and a GitHub release is published from CHANGELOG.md.
#
# Pushes (the version commit and the tags) go through a deploy key, the only actor the
# rulesets on main and on v* tags let through without a PR. The key lives in the
# "release" environment, which only main may use.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write       # gh release create
  pull-requests: read   # trunk-semver looks up the merged PR's source branch
  id-token: write       # npm trusted publishing (OIDC); no npm token is stored

jobs:
  release:
    # the bot's own version commit must not release again
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Test
        run: make test

      - name: Version
        id: version
        uses: TheKathan/trunk-semver@bdfa679941c534feeb98f967803cff48cdc3455e # v1.0.14
        with:
          major-version: "0"
          add-to-summary: "true"

      - name: Write the version into the files and move the tags onto that commit
        id: bump
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/set_version.py "$VERSION"
          python3 scripts/set_version.py --check
          if git diff --quiet; then
            echo "files already at $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): $VERSION"
          git push origin HEAD:main
          MAJOR="${VERSION%%.*}"
          git tag -f "$VERSION"
          git tag -f "$MAJOR"
          git push --force origin "refs/tags/$VERSION" "refs/tags/$MAJOR"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "release $VERSION already exists"
            exit 0
          fi
          python3 scripts/set_version.py --notes "$VERSION" > notes.md
          gh release create "$VERSION" --title "$VERSION" --notes-file notes.md --verify-tag

      # Publishes agent-baton to npm with provenance, through trusted publishing (the package
      # on npmjs.com trusts this repository, release.yml and the "release" environment).
      # Off until the repository variable NPM_PUBLISH is "true"; skips versions already on npm.
      - name: Publish to npm
        if: vars.NPM_PUBLISH == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          npm install -g npm@11   # trusted publishing needs npm >= 11.5.1
          if npm view "agent-baton@${VERSION#v}" version >/dev/null 2>&1; then
            echo "agent-baton@${VERSION#v} is already on npm"
            exit 0
          fi
          npm publish --provenance --access public
