<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 506" width="1200" height="506" role="img" aria-labelledby="t d"><title id="t">How baton works: a hand-off is refused until the question is answered</title><desc id="d">A chat-like thread between three AI agents, where every message is a typed entry appended to .baton/events/S1.jsonl under a file lock. frontend asks backend Q-001: which route serves the health check? backend tries to hand off S1-A to qa and baton refuses: 'baton: hand-off refused: - unanswered threads addressed to you: Q-001'; nothing is written. backend replies GET /api/health, defined in src/routes.js, then hand-off H-002 is posted, the baton moves to qa, and qa reads it once via its cursor. STATUS.md updates after every write.</desc><style>.s{font-family:ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}.r14{font-size:14px}.r15{font-size:15px}.b14{font-weight:700;font-size:14px}.b15{font-weight:600;font-size:15px}.b20{font-weight:800;font-size:20px;letter-spacing:-.3px}.r2b{opacity:.82}.c0{animation:c0 12000ms linear infinite both}.c1{animation:c1 12000ms linear infinite both}.c2{animation:c2 12000ms linear infinite both}.c3{animation:c3 12000ms linear infinite both}.c4{animation:c4 12000ms linear infinite both}.c5{animation:c5 12000ms linear infinite both}.cs{animation:cs 12000ms linear infinite both}.r1{animation:r1 12000ms linear infinite both}.r2{animation:r2 12000ms linear infinite both}.r2b{animation:r2b 12000ms linear infinite both}.r2x{animation:r2x 12000ms linear infinite both}.rn{animation:rn 12000ms linear infinite both}.r3{animation:r3 12000ms linear infinite both}.r4{animation:r4 12000ms linear infinite both}.r4ok{animation:r4ok 12000ms linear infinite both}.r5{animation:r5 12000ms linear infinite both}.hp{animation:hp 12000ms linear infinite both}.lk{animation:lk 12000ms linear infinite both}.l1{animation:l1 12000ms